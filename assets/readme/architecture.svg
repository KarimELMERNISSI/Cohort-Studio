<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" width="960" height="880" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">The architecture of CohortStudio</title>
<desc id="desc">Layers from the interface (app_pages, ui) through the services (manage, graph), the data work (ingest, enrich, explore, monitor) and the data and statistics engine (core, biostats, prompts) down to utils; imports go down only. The browser enters through the interface and the command line below it. Four connector families plug into the services, and the services store each user's workspace.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0A646C"/></marker></defs>
<rect width="960" height="880" rx="10" fill="#FFFFFF"/>
<rect x="56" y="14" width="290" height="48" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="70" y="34" font-size="14" fill="#0B2B36" font-weight="700">Browser</text>
<text x="70" y="52" font-size="12.5" fill="#5B7480">the Streamlit application (main.py)</text>
<rect x="610" y="14" width="330" height="48" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="624" y="34" font-size="14" fill="#0B2B36" font-weight="700">Command line and scripts</text>
<text x="624" y="52" font-size="12.5" fill="#5B7480">manage_users.py · headless replay (run_trace)</text>
<rect x="56" y="86" width="684" height="114" rx="8" fill="#F3F8F9" stroke="#DCE8EB" stroke-width="1"/>
<text x="68" y="106" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0A646C">INTERFACE<tspan dx="12" font-size="12" font-weight="400" letter-spacing="0" fill="#5B7480">the only layer that needs Streamlit</tspan></text>
<rect x="68" y="116" width="324" height="72" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="82" y="140" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">app_pages</text>
<text x="82" y="160" font-size="14" fill="#2F4A56">the pages: inputs, one service call,</text>
<text x="82" y="178" font-size="14" fill="#2F4A56">a result card</text>
<rect x="404" y="116" width="324" height="72" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="418" y="140" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ui</text>
<text x="418" y="160" font-size="14" fill="#2F4A56">shell, navigation and components;</text>
<text x="418" y="178" font-size="14" fill="#2F4A56">AppState, the one writer of the data</text>
<line x1="201" y1="62" x2="201" y2="84" stroke="#0A646C" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="56" y="218" width="884" height="258" rx="8" fill="#F3F8F9" stroke="#DCE8EB" stroke-width="1"/>
<text x="68" y="238" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0A646C">SERVICES<tspan dx="12" font-size="12" font-weight="400" letter-spacing="0" fill="#5B7480">run without Streamlit, like every layer below</tspan></text>
<rect x="68" y="248" width="495" height="72" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="82" y="272" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">manage</text>
<text x="82" y="292" font-size="14" fill="#2F4A56">traces and replay, study definition, Word report and dossier,</text>
<text x="82" y="310" font-size="14" fill="#2F4A56">accounts, AI engine, the stores of a workspace</text>
<rect x="575" y="248" width="353" height="72" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="589" y="272" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">graph</text>
<text x="589" y="292" font-size="14" fill="#2F4A56">knowledge-graph model, builders</text>
<text x="589" y="310" font-size="14" fill="#2F4A56">and renderers</text>
<text x="68" y="346" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0A646C">CONNECTORS<tspan dx="12" font-size="12" font-weight="400" letter-spacing="0" fill="#5B7480">one implementation at a time, loaded when it is used</tspan></text>
<rect x="68" y="356" width="206" height="88" rx="6" fill="#FFFFFF" stroke="#0A646C" stroke-width="1" stroke-dasharray="4 3"/>
<text x="82" y="378" font-size="13" fill="#0B2B36" font-weight="700">Identity provider</text>
<text x="82" y="397" font-size="13" fill="#2F4A56">local accounts</text>
<text x="82" y="414" font-size="13" fill="#2F4A56">Better Auth sidecar · none</text>
<rect x="286" y="356" width="206" height="88" rx="6" fill="#FFFFFF" stroke="#0A646C" stroke-width="1" stroke-dasharray="4 3"/>
<text x="300" y="378" font-size="13" fill="#0B2B36" font-weight="700">AI provider</text>
<text x="300" y="397" font-size="13" fill="#2F4A56">Ollama</text>
<path d="M300 413 l7 -7 m-5 0 h5 v5" fill="none" stroke="#8A5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="314" y="414" font-size="13" fill="#8A5300">Gemini, OpenAI,</text>
<path d="M300 430 l7 -7 m-5 0 h5 v5" fill="none" stroke="#8A5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="314" y="431" font-size="13" fill="#8A5300">Mistral, Claude</text>
<rect x="504" y="356" width="206" height="88" rx="6" fill="#FFFFFF" stroke="#0A646C" stroke-width="1" stroke-dasharray="4 3"/>
<text x="518" y="378" font-size="13" fill="#0B2B36" font-weight="700">Vector database</text>
<text x="518" y="397" font-size="13" fill="#2F4A56">LanceDB · Qdrant</text>
<path d="M518 413 l7 -7 m-5 0 h5 v5" fill="none" stroke="#8A5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="532" y="414" font-size="13" fill="#8A5300">a remote Qdrant server</text>
<rect x="722" y="356" width="206" height="88" rx="6" fill="#FFFFFF" stroke="#0A646C" stroke-width="1" stroke-dasharray="4 3"/>
<text x="736" y="378" font-size="13" fill="#0B2B36" font-weight="700">Graph engine</text>
<text x="736" y="397" font-size="13" fill="#2F4A56">Plotly · Graphviz</text>
<path d="M736 413 l7 -7 m-5 0 h5 v5" fill="none" stroke="#8A5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="750" y="414" font-size="13" fill="#8A5300">yFiles (opt-in)</text>
<path d="M70 463 l7 -7 m-5 0 h5 v5" fill="none" stroke="#8A5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="464" font-size="12" fill="#8A5300">reaches outside your server: only after an explicit consent, or an opt-in install</text>
<line x1="850" y1="62" x2="850" y2="216" stroke="#0A646C" stroke-width="1.5" marker-end="url(#head)"/>
<text x="840" y="142" font-size="12" fill="#5B7480" text-anchor="end">enters below</text>
<text x="840" y="158" font-size="12" fill="#5B7480" text-anchor="end">the interface</text>
<rect x="56" y="494" width="684" height="114" rx="8" fill="#F3F8F9" stroke="#DCE8EB" stroke-width="1"/>
<text x="68" y="514" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0A646C">DATA WORK</text>
<rect x="68" y="524" width="212" height="72" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="82" y="548" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ingest</text>
<text x="82" y="568" font-size="14" fill="#2F4A56">CSV, Excel and Parquet,</text>
<text x="82" y="586" font-size="14" fill="#2F4A56">with a parse report</text>
<rect x="292" y="524" width="212" height="72" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="306" y="548" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">enrich</text>
<text x="306" y="568" font-size="14" fill="#2F4A56">formulas and derived</text>
<text x="306" y="586" font-size="14" fill="#2F4A56">variables, imputation</text>
<rect x="516" y="524" width="212" height="72" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="530" y="548" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">explore · monitor</text>
<text x="530" y="568" font-size="14" fill="#2F4A56">quality audit and score,</text>
<text x="530" y="586" font-size="14" fill="#2F4A56">correlations, changes</text>
<rect x="56" y="626" width="684" height="176" rx="8" fill="#E6F3F4" stroke="#9CCDD2" stroke-width="1"/>
<text x="68" y="646" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0A646C">DATA AND STATISTICS ENGINE<tspan dx="12" font-size="12" font-weight="400" letter-spacing="0" fill="#5B7480">plain Python, used and tested on its own</tspan></text>
<rect x="68" y="656" width="276" height="90" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="82" y="680" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">core</text>
<text x="82" y="700" font-size="14" fill="#2F4A56">data session, analysis population,</text>
<text x="82" y="718" font-size="14" fill="#2F4A56">criteria, lineage and fingerprints,</text>
<text x="82" y="736" font-size="14" fill="#2F4A56">trace steps, study definition</text>
<rect x="356" y="656" width="240" height="90" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="370" y="680" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">biostats</text>
<text x="370" y="700" font-size="14" fill="#2F4A56">tests, effect sizes, models,</text>
<text x="370" y="718" font-size="14" fill="#2F4A56">multiple imputation, pooling;</text>
<text x="370" y="736" font-size="14" fill="#2F4A56">imports no other package</text>
<rect x="608" y="656" width="120" height="90" rx="6" fill="#FFFFFF" stroke="#C4D6DB" stroke-width="1"/>
<text x="622" y="680" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">prompts</text>
<text x="622" y="700" font-size="14" fill="#2F4A56">texts sent to</text>
<text x="622" y="718" font-size="14" fill="#2F4A56">a language</text>
<text x="622" y="736" font-size="14" fill="#2F4A56">model</text>
<rect x="68" y="758" width="660" height="32" rx="6" fill="#FFFFFF" stroke="#0A646C" stroke-width="1" stroke-dasharray="4 3"/>
<text x="82" y="779" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0A646C">CATALOGUES<tspan dx="12" font-size="12.5" font-weight="400" letter-spacing="0" fill="#5B7480">kinds declared once, named in the data: trace steps · criterion kinds · analysis kinds · checks</tspan></text>
<rect x="56" y="820" width="684" height="44" rx="8" fill="#F3F8F9" stroke="#DCE8EB" stroke-width="1"/>
<text x="82" y="848" font-size="15" fill="#0B2B36" font-weight="700" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">utils</text>
<text x="144" y="848" font-size="14" fill="#2F4A56">settings checked at start-up · logging · optional groups · paths</text>
<rect x="760" y="494" width="180" height="370" rx="8" fill="#F3F8F9" stroke="#DCE8EB" stroke-width="1"/>
<line x1="850" y1="476" x2="850" y2="492" stroke="#0A646C" stroke-width="1.5" marker-end="url(#head)"/>
<text x="774" y="514" font-size="11" font-weight="700" letter-spacing="1.1" fill="#0A646C">STORAGE</text>
<text x="774" y="535" font-size="13" fill="#0B2B36" font-weight="700">One workspace per user</text>
<rect x="774" y="554" width="5" height="5" rx="1" fill="#0A646C"/>
<text x="787" y="562" font-size="13" fill="#2F4A56">Parquet versions</text>
<text x="787" y="579" font-size="13" fill="#2F4A56">with lineage files</text>
<rect x="774" y="597" width="5" height="5" rx="1" fill="#0A646C"/>
<text x="787" y="605" font-size="13" fill="#2F4A56">Hash-chained traces</text>
<text x="787" y="622" font-size="13" fill="#2F4A56">(JSON)</text>
<rect x="774" y="640" width="5" height="5" rx="1" fill="#0A646C"/>
<text x="787" y="648" font-size="13" fill="#2F4A56">Study definition</text>
<text x="787" y="665" font-size="13" fill="#2F4A56">and its revisions</text>
<rect x="774" y="683" width="5" height="5" rx="1" fill="#0A646C"/>
<text x="787" y="691" font-size="13" fill="#2F4A56">Documents and their</text>
<text x="787" y="708" font-size="13" fill="#2F4A56">vector index</text>
<rect x="774" y="726" width="5" height="5" rx="1" fill="#0A646C"/>
<text x="787" y="734" font-size="13" fill="#2F4A56">Taxonomies and</text>
<text x="787" y="751" font-size="13" fill="#2F4A56">knowledge graphs</text>
<rect x="774" y="769" width="5" height="5" rx="1" fill="#0A646C"/>
<text x="787" y="777" font-size="13" fill="#2F4A56">Preferences</text>
<line x1="774" y1="790" x2="926" y2="790" stroke="#C4D6DB" stroke-width="1"/>
<text x="774" y="814" font-size="13" fill="#0B2B36" font-weight="700">DuckDB</text>
<text x="774" y="831" font-size="13" fill="#2F4A56">accounts, statistics</text>
<text x="774" y="848" font-size="13" fill="#2F4A56">cache</text>
<line x1="32" y1="90" x2="32" y2="860" stroke="#0A646C" stroke-width="1.5" marker-end="url(#head)"/>
<text x="23" y="475" font-size="10.5" fill="#0A646C" font-weight="700" text-anchor="middle" letter-spacing="1.3" transform="rotate(-90 23 475)">IMPORTS GO DOWN ONLY</text>
</svg>
