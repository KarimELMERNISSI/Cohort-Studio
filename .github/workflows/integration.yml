name: Integration tests (manual)

# Tests marked `integration` call live services (LLM providers, Ollama). They never run on push;
# trigger them by hand with the provider keys stored as repository secrets.
on:
  workflow_dispatch:

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMP_IAM_PROVIDER: local
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned like ci.yml: an unpinned uv picks the newest Python allowed (3.15), without wheels for the lock
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          python-version: "3.14"
          enable-cache: true

      - name: Install Python and dependencies (locked; the AI connectors are in the optional groups)
        run: uv sync --frozen --extra dev --extra all

      - name: Integration tests
        run: uv run pytest -m integration -q
