name: R reference fixtures

# Manual run (Actions > R reference fixtures > Run workflow). Computes the R mice / mitml reference values
# that tests/biostats_layer/test_mi_r_parity.py compares against, and pushes them to the r-fixtures branch,
# from which they are copied into main. The commit carries the repository owner's identity.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixtures:
    name: mice / mitml reference values
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install the R packages (binary builds)
        run: Rscript -e 'install.packages(c("mice", "mitml", "survival", "jsonlite", "broom"))'

      - name: Compute the reference values
        run: Rscript tests/reference/r/make_mi_fixtures.R tests/reference/fixtures/mi

      - name: Push them to the r-fixtures branch
        run: |
          git config user.name "Karim Elmernissi"
          git config user.email "karim.elmernissi.75@gmail.com"
          git checkout -B r-fixtures
          git add -f tests/reference/fixtures/mi
          git commit -m "test(mi): R mice/mitml reference values (workflow run ${{ github.run_id }})"
          git push --force origin r-fixtures
