name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMP_IAM_PROVIDER: local
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies (locked)
        run: uv sync --frozen --dev

      - name: Lint (syntax errors, undefined names, unused imports, duplicate keys)
        run: uv run ruff check --select E9,F --ignore F841 --output-format github .

      - name: Tests (offline, integration tests excluded)
        run: uv run pytest -m "not integration" -q
