version: 2
updates:
  # Python dependencies: uv.lock is the source of truth (CI and the Docker image install from it). Dependabot
  # updates it; after a merge, the "Sync requirements" workflow regenerates requirements.txt and
  # requirements-yfiles.txt from it, so the pip installation gets the same versions.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "actions"
      - "security"
