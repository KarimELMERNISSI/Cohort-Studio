# Streamlit runtime configuration (committed). The application's settings and secrets come from the environment
# and .env only (utils/settings.py, template .env.example); a .streamlit/secrets.toml is not read.

[secrets]
# No secrets file: Streamlit would otherwise copy every value of .streamlit/secrets.toml into the environment when the
# server starts, over the environment and .env, before the settings are validated (M5b review).
files = []

[browser]
# No usage statistics leave the server (privacy requirement for clinical deployments).
gatherUsageStats = false

[server]
maxUploadSize = 500
enableXsrfProtection = true

[client]
# Hide the Deploy button and developer-only menu entries; the menu keeps Settings (light/dark theme switch).
toolbarMode = "viewer"

# ---------------------------------------------------------------------------------------------
# Theme. Brand palette sampled from the logo (navy outlines, teal, cyan, mint); design tokens are
# mirrored in ui/theme.py and a unit test keeps both in sync. Fonts are the ones Streamlit ships
# (Source Sans 3), so nothing is fetched from the internet.
# ---------------------------------------------------------------------------------------------
[theme]
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["2rem", "1.4rem", "1.15rem", "1rem", "0.95rem", "0.85rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
# Okabe-Ito: colour-blind safe categorical palette (same order as ui/theme.py)
chartCategoricalColors = ["#0072B2", "#E69F00", "#009E73", "#D55E00", "#CC79A7", "#56B4E9", "#F0E442", "#000000"]
chartSequentialColors = ["#E6F6F7", "#C4EBEE", "#9BDDE1", "#6FCBD2", "#45B6C0", "#2A9CA7", "#18818C", "#0E6873", "#0B505A", "#093A42"]

