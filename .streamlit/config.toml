# Streamlit runtime configuration (committed). Secrets belong in secrets.toml, which is git-ignored.

[browser]
# No usage statistics leave the server (privacy requirement for clinical deployments).
gatherUsageStats = false

[server]
maxUploadSize = 500
enableXsrfProtection = true

# Design tokens are mirrored in ui/theme.py (a unit test keeps them in sync).
[theme]
base = "light"
primaryColor = "#1F5F8B"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#F4F6F8"

[theme.dark]
primaryColor = "#2F81F7"
