services:
  cohortstudio:
    build:
      context: .
      args:
        WITH_YFILES: "0"   # "1" adds the optional proprietary graph engine (online runtime, usage analytics)
    image: cohortstudio:latest
    container_name: cohortstudio
    ports:
      - "8501:8501"
    volumes:
      # Per-user workspaces, the user directory and traces. The container runs as uid 1000:
      # on Linux hosts run `chown -R 1000:1000 data` once.
      - ./data:/app/data
      # Optional study configuration files
      - ./config:/app/config
    env_file:
      # Bootstrap administrator (CMP_ADMIN_USERNAME / CMP_ADMIN_PASSWORD or CMP_ADMIN_PASSWORD_FILE),
      # AI provider keys and other settings: see .env.example. Without CMP_ADMIN_PASSWORD, the first start writes a
      # one-time setup token to the log (`docker compose logs cohortstudio`) to create the administrator.
      - path: .env
        required: false
    environment:
      - DATA_ROOT=/app/data
      - CMP_GRAPH_RENDERER=plotly
      - CMP_IAM_PROVIDER=local
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # Vector database: LanceDB embedded by default. For several users or large libraries, start the
      # qdrant service below and set CMP_VECTOR_STORE=qdrant and CMP_QDRANT_URL=http://qdrant:6333
      - CMP_VECTOR_STORE=auto
      # Worker processes for the multiple imputation, shared by all users. The app cannot see a CPU limit set on
      # the container: with one, set this to the cores the container may use.
      # - CMP_MI_MAX_WORKERS=3
    restart: unless-stopped

  # Optional Qdrant server (uncomment, then set CMP_VECTOR_STORE / CMP_QDRANT_URL above)
  # qdrant:
  #   image: qdrant/qdrant:v1.19.2   # the server release matching qdrant-client in uv.lock (1.19)
  #   container_name: cohortstudio_qdrant
  #   volumes:
  #     - ./data/qdrant:/qdrant/storage
  #   restart: unless-stopped
