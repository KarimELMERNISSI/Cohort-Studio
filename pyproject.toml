[project]
name = "cohort-monitoring-package"
version = "2.3.0"
description = "Clinical and epidemiological cohort data management, monitoring, analysis, and enrichment platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web & UI
    "streamlit>=1.65.0",
    "pillow>=12.0.0",

    # Data Processing & Storage
    "pandas>=3.0.0",
    "tabulate>=0.9.0",
    "numpy>=2.5.0",
    "duckdb>=1.5.0",
    "openpyxl>=3.1.5",
    "detect-delimiter>=0.1.1",
    "charset-normalizer>=3.5.0",

    # Machine Learning & Statistics
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.15.0",
    "lightgbm>=4.7.0",
    "umap-learn>=0.5.12",
    "prince>=0.21.0",
    "networkx>=3.4",

    # Visualization
    "plotly>=7.1.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",

    # AI, RAG & LLMs
    "google-genai>=2.29.0",
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langchain-community>=0.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.0",
    "chromadb>=1.5.0",
    "pypdf>=6.19.0",

    # Security & Utilities
    "bcrypt>=5.0.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.0",
    "rapidfuzz>=3.14.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# Proprietary interactive graph engine (yWorks free license: loads its runtime from yworks.com at
# render time and reports anonymised usage data). Opt in with `uv sync --extra graph-yfiles` and
# CMP_GRAPH_RENDERER=yfiles; the default Plotly/NetworkX engine works offline.
graph-yfiles = [
    "yfiles-graphs-for-streamlit>=2.0,<3",
]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]
survival = [
    "lifelines>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manage", "enrich", "explore", "monitor", "prompts", "utils", "app_pages", "graph"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Strict on the packages written under the 2026 audit; the legacy pages/helpers keep their style until they are split.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "RUF100", "PLR0124"]
ignore = ["E731", "E741", "B008", "B904", "B905", "SIM108", "SIM117", "UP015"]

[tool.ruff.lint.per-file-ignores]
"app_pages/**" = ["B", "SIM", "UP", "E7", "E402", "F841", "W291", "W293"]
"utils/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"manage/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"enrich/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"explore/**" = ["B", "SIM", "UP", "E7", "E402", "F841", "W291", "W293"]
"monitor/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"prompts/**" = ["E", "W"]
"dev_scripts/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"tests/**" = ["B", "SIM", "E7", "E402", "F841", "W291", "W293"]
"main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app_pages", "biostats", "core", "enrich", "explore", "graph", "ingest", "manage", "monitor", "prompts", "ui", "utils"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "dev_scripts/*", ".venv/*", "docs/*"]

[tool.coverage.report]
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests requiring external services or API keys",
]
addopts = "-m 'not integration' -ra"

