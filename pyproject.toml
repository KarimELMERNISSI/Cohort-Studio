[project]
name = "cohortstudio"
version = "2.4.1"
description = "CohortStudio: clinical cohort data from raw file to reproducible evidence (quality, enrichment, biostatistics, literature knowledge, traced reports)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web & UI
    "streamlit>=1.65.0",
    "pillow>=13.0.0",  # 12.x has 24 known vulnerabilities, fixed in 13.0.0

    # Data Processing & Storage
    "pandas>=3.0.0",
    "tabulate>=0.9.0",
    "numpy>=2.5.0",
    "duckdb>=1.5.0",
    "pyarrow>=25.0",  # Parquet versions keep dtypes and row ids (the __row_id index)
    "openpyxl>=3.1.5",  # Excel .xlsx and .xlsm
    "xlrd>=2.0.1",  # legacy Excel .xls
    "charset-normalizer>=3.5.0",

    # Machine Learning & Statistics
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.15.0",
    "networkx>=3.4",

    # Visualization
    "plotly>=7.1.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",

    # Security & Utilities
    "bcrypt>=5.0.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.0",
    "rapidfuzz>=3.14.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# Optional groups (follow-up programme M4): the statistics engine, the data pipeline and the analysis pages need
# none of them. `uv sync --extra all` (Docker, requirements.txt) installs everything.
# AI features: variable map, document library and chat, AI suggestions (LLM connectors and vector databases).
ai = [
    "google-genai>=2.29.0",
    "langchain-core>=1.6.0",
    "langchain-text-splitters>=1.1.0",
    "pypdf>=6.19.0",
    "anthropic>=1.0",  # Claude connector (chat; documents embedded by another provider)
    "openai>=3.0",  # OpenAI connector, and Mistral's (an OpenAI-compatible API)
    "httpx>=0.28",  # Ollama connector
    # Vector databases (selectable in Settings > AI engine): LanceDB embedded by default, Qdrant embedded or server
    "lancedb>=0.25",
    "qdrant-client>=1.15",
]
# Machine-learning methods of Enrich and Explore: MissForest imputation (LightGBM), UMAP, FAMD (prince).
ml = [
    "lightgbm>=4.7.0",
    "umap-learn>=0.5.12",
    "prince>=0.21.0",
]
all = [
    "cohortstudio[ai,ml,survival]",
]
# Proprietary interactive graph engine (yWorks free license: loads its runtime from yworks.com at
# render time and reports anonymised usage data). Opt in with `uv sync --extra graph-yfiles` and
# CMP_GRAPH_RENDERER=yfiles; the default Plotly/NetworkX engine works offline.
graph-yfiles = [
    "yfiles-graphs-for-streamlit>=2.0,<3",
]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]
survival = [
    "lifelines>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Every first-party package (tests/test_quality_gates.py keeps this list equal to isort's known-first-party).
packages = ["app_pages", "biostats", "core", "enrich", "explore", "graph", "ingest", "manage", "monitor", "prompts", "ui", "utils"]

[tool.ruff]
line-length = 100
target-version = "py314"
# the exclusions apply to files named on the command line too (pre-commit names them)
force-exclude = true

[tool.ruff.format]
# Formatting applies to every file but these, not yet formatted. The list only shrinks
