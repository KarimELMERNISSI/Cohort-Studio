[project]
name = "cohort-monitoring-package"
version = "0.2.0"
description = "Clinical and epidemiological cohort data management, monitoring, analysis, and enrichment platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web & UI
    "streamlit>=1.65.0",
    "yfiles-graphs-for-streamlit>=2.0.0",
    "pillow>=12.0.0",

    # Data Processing & Storage
    "pandas>=3.0.0",
    "numpy>=2.5.0",
    "duckdb>=1.5.0",
    "openpyxl>=3.1.5",
    "detect-delimiter>=0.1.1",
    "charset-normalizer>=3.5.0",

    # Machine Learning & Statistics
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.15.0",
    "lightgbm>=4.7.0",
    "umap-learn>=0.5.12",
    "prince>=0.21.0",
    "networkx>=3.4",

    # Visualization
    "plotly>=7.1.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",

    # AI, RAG & LLMs
    "google-genai>=2.29.0",
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langchain-community>=0.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.0",
    "chromadb>=1.5.0",
    "pypdf>=6.19.0",

    # Security & Utilities
    "bcrypt>=5.0.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.0",
    "rapidfuzz>=3.14.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manage", "enrich", "explore", "monitor", "prompts", "utils", "app_pages"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests requiring external services or API keys",
]

