[tool.ruff.lint]
# Strict on the packages written under the 2026 audit; the legacy pages/helpers keep their style until they are split.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "RUF100", "PLR0124"]
ignore = ["E731", "E741", "B008", "B904", "B905", "SIM108", "SIM117", "UP015"]

[tool.ruff.lint.per-file-ignores]
"app_pages/**" = ["B", "SIM", "UP", "E7", "E402", "F841", "W291", "W293"]
"utils/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"manage/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"enrich/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"explore/**" = ["B", "SIM", "UP", "E7", "E402", "F841", "W291", "W293"]
"monitor/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"prompts/**" = ["E", "W"]
"dev_scripts/**" = ["B", "SIM", "UP", "E7", "F841", "W291", "W293"]
"tests/**" = ["B", "SIM", "E7", "E402", "F841", "W291", "W293"]
"main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app_pages", "biostats", "core", "enrich", "explore", "graph", "ingest", "manage", "monitor", "prompts", "ui", "utils"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "dev_scripts/*", ".venv/*", "docs/*"]

[tool.coverage.report]
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests requiring external services or API keys",
    "slow: statistical simulation suites (minutes; run with -m slow)",
]
addopts = "-m 'not integration and not slow' -ra"

