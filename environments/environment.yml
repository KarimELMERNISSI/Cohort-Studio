# Conda environment for CohortStudio: Python 3.14 from conda-forge, then the locked packages of requirements.txt
# (exported from uv.lock: the application and every optional group except the proprietary graph-yfiles engine).
#
#   conda env create -f environments/environment.yml
#   conda activate cohortstudio
#   streamlit run main.py
#
# The packages are not listed here: a list of its own drifted from pyproject.toml. Conda runs pip from this
# folder, so the path below is relative to it.
name: cohortstudio
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip
  - pip:
      - -r ../requirements.txt
